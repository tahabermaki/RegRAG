# RegRAG — tous les services du projet.
# Démarrage : `make up` (cœur) ou `make up-obs` (cœur + Prometheus/Grafana).
#
# Images toutes prêtes (Docker Hub) : qdrant, postgres, redis, prometheus, grafana.
# Images construites avec NOTRE Dockerfile : api, worker (même image, commande différente), ui.

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: regrag-app:local
  env_file: .env
  restart: unless-stopped
  depends_on:
    qdrant:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------- Stockage ----------
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.1}
    ports: ["6333:6333"]          # API REST + tableau de bord : http://localhost:6333/dashboard
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      # L'image Qdrant n'a ni curl ni wget : on teste le port avec bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regrag}
      POSTGRES_USER: ${POSTGRES_USER:-regrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regrag}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regrag} -d ${POSTGRES_DB:-regrag}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- Notre code ----------
  api:
    <<: *app
    command: ["uvicorn", "regrag.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]          # http://localhost:8000/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["arq", "regrag.worker.main.WorkerSettings"]

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: regrag-ui:local
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]          # http://localhost:8501
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Observabilité (profil "observability") ----------
  # Langfuse arrivera en phase 4 (il ajoute 6 services : web, worker, Postgres, ClickHouse, Redis, MinIO).
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability"]
    volumes: ["./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:13.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["3001:3000"]          # 3000 est réservé à Langfuse (phase 4)
    depends_on: [prometheus]

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  grafana_data:
