[project]
name = "regrag"
version = "0.0.1"
description = "Un RAG réglementaire (IA, assurance) conçu pour la production."
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
